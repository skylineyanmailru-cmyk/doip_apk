name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull Buildozer image
        run: docker pull kivy/buildozer:1.5.0

      - name: Build APK
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}":/home/user/hostcwd \
            kivy/buildozer:1.5.0 \
            android debug

      - name: Fix ownership
        run: |
          sudo chown -R "$(id -u)":"$(id -g)" "${{ github.workspace }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leapmotor-doip-apk
          path: bin/*.apk