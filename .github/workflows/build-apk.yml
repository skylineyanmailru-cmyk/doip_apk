name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential \
            ccache

      - name: Install buildozer and Cython
        run: |
          # Pin pip to a version that predates PyPI's newer "Android
          # wheel" platform tags (e.g. cp314-...-android_24_arm64_v8a).
          # A newer pip can auto-detect the Android target and fetch a
          # prebuilt wheel that mismatches the actual build config,
          # failing with "... is not a supported wheel on this platform".
          # Pinning pip keeps dependency installs on the old, reliable
          # "build from source" path that python-for-android expects.
          python -m pip install --upgrade "pip==24.0"
          pip install --upgrade buildozer cython==0.29.33

      - name: Clone a pinned, known-good python-for-android
        run: |
          git clone --branch v2024.01.21 --depth 1 \
            https://github.com/kivy/python-for-android.git p4a-pinned
          # Sanity check: fail fast if the checkout didn't land on the
          # expected tag, instead of silently building with something else.
          cd p4a-pinned
          git describe --tags

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: leapmotor-doip-apk
          path: bin/*.apk
