name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull official kivy/buildozer image
        run: docker pull kivy/buildozer:latest

      - name: Build APK with the official Buildozer Docker image
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}":/home/user/hostcwd \
            kivy/buildozer android debug

      - name: Fix ownership of build output
        # The container may write files as a different UID than the
        # runner user, which would otherwise block the upload step.
        run: sudo chown -R "$(id -u)":"$(id -g)" "${{ github.workspace }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: leapmotor-doip-apk
          path: bin/*.apk
