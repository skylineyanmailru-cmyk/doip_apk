name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade https://github.com/kivy/buildozer/archive/master.zip

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/licenses"
          yes | sdkmanager --licenses || true

      - name: Install Android SDK Build Tools
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;37.0.0"

      - name: Check Build Environment
        run: |
          buildozer --version
          python3 --version
          python3 -m pip show python-for-android || true

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leapmotor-doip-apk
          path: bin/*.apk