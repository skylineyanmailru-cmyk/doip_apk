name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade https://github.com/kivy/buildozer/archive/master.zip

      - name: Check Build Environment
        run: |
          echo "===== Buildozer ====="
          buildozer --version

          echo "===== Python ====="
          python3 --version

          echo "===== Packages ====="
          python3 -m pip show buildozer || true
          python3 -m pip show python-for-android || true
          python3 -m pip list | grep -E 'buildozer|python-for-android|kivy|cython' || true

          echo "===== buildozer.spec ====="
          grep -nE '^\[app:android\]|^p4a.branch|^android.api|^android.minapi|^android.ndk|^android.archs' buildozer.spec || true

          echo "===== requirements ====="
          grep -n '^requirements' buildozer.spec || true

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leapmotor-doip-apk
          path: bin/*.apk